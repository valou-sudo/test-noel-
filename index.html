<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Une petite surprise de Noël</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#28584c,#091e20 75%);color:#fff0d2;font-family:Georgia,serif;text-align:center;min-height:100vh}main{position:relative;max-width:480px;margin:auto;padding:36px 20px}h1{font-size:32px}p{line-height:1.6}button{font:inherit;color:#ffe8b0;background:#792d38;border:2px solid #d7b46c;border-radius:80px 80px 12px 12px;padding:30px;width:160px;height:190px;box-shadow:0 0 35px #e7bd6355;cursor:pointer;font-size:24px}button:focus-visible{outline:3px solid white}#gift{background:#173b32;border:1px solid #c5a46b;border-radius:18px;padding:18px;margin-top:20px}video,svg{width:100%;border-radius:12px} .snow{position:fixed;top:-20px;pointer-events:none;animation:fall linear infinite;color:white;opacity:.7}@keyframes fall{to{transform:translateY(110vh)}}@media(prefers-reduced-motion:reduce){.snow{display:none}}</style></head><body><main><p>✦ &nbsp; DÉCEMBRE &nbsp; ✦</p><h1>Une petite lumière de Noël</h1><p>Un soupçon de magie, juste pour sourire.</p><button id="door" aria-expanded="false" aria-controls="gift">✦<br>1<br>🎁<br><small style="font-size:14px">Ouvre-moi</small></button><section id="gift" hidden><h2>Surprise !</h2><svg role="img" aria-label="Village enneigé" viewBox="0 0 320 180"><rect width="320" height="180" fill="#193348"/><circle cx="260" cy="38" r="23" fill="#ffe3a0"/><path d="M0 140Q80 110 160 145T320 130V180H0" fill="#f2eee5"/><g fill="#944b3b"><path d="M40 95H110V145H40Z M185 85H265V145H185Z"/></g><g fill="#fff3e1"><path d="M30 96L75 53L120 96Z M175 86L225 40L275 86Z"/></g><g fill="#ffd478"><rect x="53" y="108" width="16" height="20"/><rect x="82" y="108" width="16" height="20"/><rect x="200" y="100" width="18" height="22"/><rect x="234" y="100" width="18" height="22"/></g><path d="M145 65L118 130H172Z" fill="#376b55"/></svg><p>Que ta journée soit pleine de petites lumières. ✨</p><video controls playsinline preload="none" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video><p style="font-size:13px">Vidéo de test : appuie sur lecture.</p></section></main><script>const d=document.getElementById('door'),g=document.getElementById('gift');d.addEventListener('click',()=>{g.hidden=!g.hidden;d.setAttribute('aria-expanded',String(!g.hidden));if(!g.hidden)g.scrollIntoView({behavior:'smooth',block:'nearest'})});for(let i=0;i<30;i++){let s=document.createElement('span');s.className='snow';s.textContent='❄';s.style.left=(i*37%100)+'%';s.style.animationDuration=(7+i%8)+'s';s.style.animationDelay=-(i%12)+'s';s.style.fontSize=(8+i%10)+'px';document.body.appendChild(s)}</script></body></html>
